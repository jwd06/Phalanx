<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Phalanx</title>
</head>
<body>
    <!--This is the welcome text-->
    <h2>Welcome to Phalanx</h2>

    <!--This is where the input fields will be-->

    <div id="top-menu">
        <ul>
            <li id="menu-calorie-calculator">
                <a href="#calorie-calculator">Calorie Calculator</a>
            </li>

            <li id="menu-workout-split">
                <a href="#workout-split">Workout Split</a>
            </li>

            <li id="menu-food-nutrition">
                <a href="#food-nutrition">Nutrition Fact</a>
            </li>
        </ul>
    </div>

    <div id="calorie-calculator" class="section">

        <ul id="unit-switcher">
            <li id="unit-metric" class="unit-option active-unit">Metric (kg / cm)</li>
            <li id="unit-us" class="unit-option">US (lbs / ft + in)</li>
        </ul>

        <form id="calculator-form">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="0"><br><br>

            <label for="weight">Weight:</label>
            <input type="number" id="weight" name="weight" placeholder="kg" min="0"><br><br>

            <div id="height-metric">
                <label for="height">Height:</label>
                <input type="number" id="height" name="height" placeholder="cm" min="0"><br><br>
            </div>

            <div id="height-us" style="display:none">
                <label>Height:</label>
                <input type="number" id="height-ft" name="height-ft" placeholder="ft" min="0">
                <input type="number" id="height-in" name="height-in" placeholder="in" min="0" max="11"><br><br>
            </div>

            <label for="gender">Gender: </label>
            <select name="gender" id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <br><br>

            <label for="activity-level">Activity Level: </label>
            <select name="activity-level" id="activity-level">
                <option value="sedentary">Sedentary (little or no exercise)</option>
                <option value="light">Light (exercise 1-3 times/week)</option>
                <option value="moderate">Moderate (exercise 4-5 times/week)</option>
                <option value="active">Active (daily exercise or intense exercise 3-4 times/week)</option>
                <option value="very-active">Very Active (intense exercise 6-7 times/week)</option>
                <option value="extra-active">Extra Active (physical job)</option>
                <option value="athlete">Athlete</option>
            </select>
            <br><br>

            <label for="goal">Goal: </label>
            <select name="goal" id="goal">
                <option value="maintain-weight">Maintain Weight</option>
                <option value="gain-weight">Gain Weight</option>
                <option value="lose-weight">Lose Weight</option>
            </select>
            <br><br>

            <!--Calorie Offset for Weigth Loss-->
            <div id="calorie-offset-weight-loss" style="display: none;">
                <label for="calorie-offset-weight-loss">Calorie Offset</label>
                <select name="calorie-offset-wl" id="calorie-offset-wl">
                    <option value="mild">Mild Weight Loss</option>
                    <option value="normal">Weight Loss</option>
                    <option value="extreme">Extreme Weight Loss</option>
                </select>
                <br><br>
            </div>


            <!--Calorie Offset for Weigth Gain-->
            <div id="calorie-offset-weight-gain" style="display: none;">
                <label for="calorie-offset-weight-gain">Calorie Offset</label>
                <select name="calorie-offset-wg" id="calorie-offset-wg">
                    <option value="mild">Mild Weight Gain</option>
                    <option value="normal">Weight Gain</option>
                    <option value="extreme">Extreme Weight Gain</option>
                </select>
                <br><br>
            </div>

            <!--Macro Nutrient Mode Selector (hidden until Calculate is clicked)-->
            <ul id="mac-mode-selector" style="display: none;">
                <li id="macro-balanced" class="macro-option active-macro">Balanced</li>
                <li id="macro-custom" class="macro-option">Create Custom</li>
            </ul>

            <!--Custom Macro Sliders-->
            <div id="macro-slider-selection" style="display: none;">
                <p class="slider-hint">Slide the bars to create your own plan</p>
                <div class="slider-row">
                    <label>Protein: <span id="protein-pct">30</span>%</label>
                    <input type="range" min="5" max="90" value="30" class="slider" id="proteins-slider">
                </div>
                <div class="slider-row">
                    <label>Carbs: <span id="carbs-pct">50</span>%</label>
                    <input type="range" min="5" max="90" value="50" class="slider" id="carbohydrates-slider">
                </div>
                <div class="slider-row">
                    <label>Fats: <span id="fats-pct">20</span>%</label>
                    <input type="range" min="5" max="90" value="20" class="slider" id="fats-slider">
                </div>
            </div>



            <button type="button" id="calculate-button">Calculate</button>
        </form>

        <div id="results"></div>
        <div id="macro-result"></div>

    </div>

    <div id="workout-split" class="section" style="display:none">
        <p>Workout Split — coming soon</p>
    </div>

    <div id="food-nutrition" class="section" style="display:none">
        <p>Nutrition Facts — coming soon</p>
    </div>

    
    <script src="js/validator.js"></script>
    <script type="module" src="js/app.js"></script>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Phalanx</title>
    
</head>
<body>
    <!--This is the welcome text-->
    <h2>Welcome to Phalanx</h2>

    <!--This is where the input fields will be-->

    <div id="top-menu">
        <ul>
            <li id="menu-calorie-calculator">
                <a href="#calorie-calculator">Calorie Calculator</a>
            </li>

            <li id="menu-workout-split">
                <a href="#workout-split">Workout Split</a>
            </li>

            <li id="menu-food-nutrition">
                <a href="#food-nutrition">Nutrition Fact</a>
            </li>
        </ul>
    </div>

    <div id="calorie-calculator" class="section">

        <ul id="unit-switcher">
            <li id="unit-metric" class="unit-option active-unit">Metric (kg / cm)</li>
            <li id="unit-us" class="unit-option">US (lbs / ft + in)</li>
        </ul>

        <form id="calculator-form">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="0"><br><br>

            <label for="weight">Weight:</label>
            <input type="number" id="weight" name="weight" placeholder="kg" min="0"><br><br>

            <div id="height-metric">
                <label for="height">Height:</label>
                <input type="number" id="height" name="height" placeholder="cm" min="0"><br><br>
            </div>

            <div id="height-us" style="display:none">
                <label>Height:</label>
                <input type="number" id="height-ft" name="height-ft" placeholder="ft" min="0">
                <input type="number" id="height-in" name="height-in" placeholder="in" min="0" max="11"><br><br>
            </div>

            <label for="gender">Gender: </label>
            <select name="gender" id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <br><br>

            <label for="activity-level">Activity Level: </label>
            <select name="activity-level" id="activity-level">
                <option value="sedentary">Sedentary (little or no exercise)</option>
                <option value="light">Light (exercise 1-3 times/week)</option>
                <option value="moderate">Moderate (exercise 4-5 times/week)</option>
                <option value="active">Active (daily exercise or intense exercise 3-4 times/week)</option>
                <option value="very-active">Very Active (intense exercise 6-7 times/week)</option>
            </select>
            <br><br>

            <label for="goal">Goal: </label>
            <select name="goal" id="goal">
                <option value="gain-weight">Gain Weight</option>
                <option value="maintain-weight">Maintain Weight</option>
                <option value="lose-weight">Lose Weight</option>
            </select>
            <br><br>

            <button type="button" id="calculate-button">Calculate</button>
        </form>

        <div id="results"></div>

    </div>

    <div id="workout-split" class="section" style="display:none">
        <p>Workout Split — coming soon</p>
    </div>

    <div id="food-nutrition" class="section" style="display:none">
        <p>Nutrition Facts — coming soon</p>
    </div>

    
    <script src="js/validator.js"></script>
    <script type="module" src="js/app.js"></script>
    
</body>
</html>
